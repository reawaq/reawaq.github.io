<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- تعديل الميتا تاج لقفل الزوم وضبط الأبعاد للايفون -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مفاجأة سهورتي</title>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --x: 50vw;
            --y: 50vh;
            /* تصغير حجم الدائرة السحرية على الموبايل شوية */
            --clip-r: min(15vw, 65px); 
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* يمنع السكرول */
            background-color: #f4ece4;
            /* قفل التحديد وحركة السحب للايفون */
            user-select: none; 
            -webkit-user-select: none;
            touch-action: none; 
            overscroll-behavior: none;
        }

        .base-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
            color: #4a3c31;
            padding: 20px;
            box-sizing: border-box;
        }

        .title-container {
            position: relative;
            text-align: center;
            margin-bottom: 5px;
            z-index: 10;
        }

        /* تصغير الخطوط تلقائياً حسب حجم الشاشة */
        .title-container h1 { 
            font-family: 'Changa', sans-serif;
            font-size: clamp(2.2rem, 8vw, 4rem); 
            margin: 0;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .base-layer p { 
            font-family: 'Changa', sans-serif;
            font-size: clamp(1rem, 4vw, 1.5rem);
            color: #8c8277; 
            margin-bottom: 25px; 
            text-align: center;
        }

        .btn {
            font-family: 'Changa', sans-serif;
            font-size: clamp(0.9rem, 3.5vw, 1.2rem);
            padding: 10px 25px;
            background-color: #ff4757; 
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: transform 0.2s;
            pointer-events: auto;
            box-shadow: 0px 4px 0px #c0392b;
            white-space: nowrap;
        }
        .btn:hover { 
            transform: scale(1.05) translateY(-2px); 
            box-shadow: 0px 6px 0px #c0392b;
        }
        .btn:active {
            transform: scale(1) translateY(4px);
            box-shadow: 0px 0px 0px #c0392b;
        }

        .big-404 {
            position: absolute;
            font-size: clamp(8rem, 25vw, 30vw);
            font-weight: 900;
            color: #e6d8b8;
            z-index: -1;
            bottom: 15%;
            line-height: 1;
            font-family: Arial, sans-serif;
        }

        .floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: #e8dbca;
            border-top: 2px solid #d4c5b0;
            z-index: 2;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(0,0,0,0.03) 50px, rgba(0,0,0,0.03) 52px);
        }

        .hidden-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #2f0a0d; 
            z-index: 3;
            pointer-events: none;
            clip-path: circle(var(--clip-r) at var(--x) var(--y));
            -webkit-clip-path: circle(var(--clip-r) at var(--x) var(--y));
        }

        .hidden-layer .big-404 { color: #5e1c22; }

        /* --- الكتكوت الصغير واللافتة --- */
        .baby-chick {
            position: absolute;
            top: -45px;
            left: 50%;
            margin-left: -20px;
            width: 40px;
            height: 40px;
            animation: babyMove 16s infinite ease-in-out;
            pointer-events: none;
        }

        .baby-sign {
            position: absolute;
            top: -40px;
            left: 50%;
            margin-left: -55px; 
            width: 110px;
            background: #e8dbca;
            border: 3px solid #4a3c31;
            color: #4a3c31;
            font-family: 'Changa', sans-serif;
            font-size: 13px;
            text-align: center;
            padding: 4px;
            border-radius: 6px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            opacity: 0;
            transform-origin: bottom center;
            animation: babySignAnim 16s infinite ease-in-out;
            z-index: 20;
        }
        .baby-sign::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            margin-left: -3px;
            width: 6px;
            height: 15px;
            background: #4a3c31;
        }

        .baby-body {
            position: absolute;
            width: 40px;
            height: 35px;
            background: #2a221f;
            border-radius: 50% 50% 40% 40%;
            bottom: 0;
        }

        .baby-comb {
            position: absolute;
            top: -8px;
            right: 8px;
            width: 15px;
            height: 8px;
            background: #c75c50;
            border-radius: 8px 8px 0 0;
        }

        .baby-beak {
            position: absolute;
            top: 15px;
            right: -6px;
            width: 0;
            height: 0;
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            border-left: 8px solid #f2a65a;
            animation: babyBeakAnim 16s infinite ease-in-out;
        }

        .baby-eye {
            position: absolute;
            top: 8px;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: babyEyeAnim 16s infinite ease-in-out;
        }
        .baby-eye.left { right: 15px; }
        .baby-eye.right { right: 3px; }

        .baby-pupil {
            width: 5px;
            height: 5px;
            background: #111;
            border-radius: 50%;
            animation: babyPupilAnim 16s infinite ease-in-out;
        }

        .baby-blush {
            position: absolute;
            top: 18px;
            width: 8px;
            height: 4px;
            background: #ff6b81;
            border-radius: 50%;
            opacity: 0;
            animation: babyBlushAnim 16s infinite ease-in-out;
        }
        .baby-blush.left { right: 18px; }
        .baby-blush.right { right: 1px; }

        .baby-wing {
            position: absolute;
            top: 15px;
            width: 14px;
            height: 8px;
            background: #c75c50;
            border-radius: 8px 8px 2px 2px;
        }
        .baby-wing.left { left: -6px; transform-origin: right top; animation: babyWingLeft 16s infinite ease-in-out; }
        .baby-wing.right { right: -6px; transform-origin: left top; animation: babyWingRight 16s infinite ease-in-out; }

        .baby-surprise-mark {
            position: absolute;
            top: -25px;
            right: -10px;
            font-family: 'Changa', sans-serif;
            color: #ff4757;
            font-size: 22px;
            font-weight: bold;
            opacity: 0;
            animation: babyMarkAnim 16s infinite ease-in-out;
        }

        /* --- أنيميشن الكتكوت الصغير --- */
        @keyframes babyMove {
            0%, 5%, 95%, 100% { transform: translateY(0) translateX(0) rotate(0); }
            10%, 25% { transform: translateY(25px) translateX(0) scale(1.1) rotate(0); }
            32%, 45% { transform: translateY(-15px) translateX(0) scale(1) rotate(0); }
            52%, 65% { transform: translateY(0) translateX(0) scale(1) rotate(-10deg); }
            70% { transform: translateY(-5px) translateX(20px) rotate(15deg); }
            72% { transform: translateY(-5px) translateX(-20px) rotate(-15deg); }
            74% { transform: translateY(-5px) translateX(15px) rotate(10deg); }
            76%, 90% { transform: translateY(0) translateX(0) rotate(0); }
        }

        @keyframes babySignAnim {
            0%, 74% { opacity: 0; transform: translateY(10px) scale(0); }
            76%, 90% { opacity: 1; transform: translateY(-25px) scale(1); } 
            92%, 100% { opacity: 0; transform: translateY(10px) scale(0); }
        }

        @keyframes babyEyeAnim {
            0%, 5%, 95%, 100% { height: 10px; top: 8px; border-radius: 50%; background: white; width: 10px; }
            10%, 25% { height: 3px; top: 12px; border-radius: 10px; background: #111; width: 10px; } 
            32%, 45% { height: 14px; width: 12px; top: 6px; background: white; } 
            52%, 65% { height: 10px; top: 8px; border-radius: 50%; background: white; width: 10px;} 
            70%, 90% { height: 10px; top: 8px; border-radius: 50%; background: white; width: 10px;}
        }

        @keyframes babyPupilAnim {
            0%, 5%, 95%, 100% { transform: translate(0, 0); opacity: 1; width: 5px; height: 5px; }
            10%, 25% { opacity: 0; } 
            32%, 45% { transform: translate(0, 0); opacity: 1; width: 6px; height: 6px; }
            52%, 65% { transform: translate(-2px, 3px); opacity: 1; width: 5px; height: 5px; } 
            70%, 90% { transform: translate(0, 0); opacity: 1; width: 5px; height: 5px;}
        }

        @keyframes babyBeakAnim {
            0%, 5%, 95%, 100% { border-left: 8px solid #f2a65a; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
            10%, 25% { border-left: 8px solid #f2a65a; border-top: 1px solid transparent; border-bottom: 1px solid transparent; } 
            32%, 45% { border-left: 12px solid #f2a65a; border-top: 8px solid transparent; border-bottom: 8px solid transparent; } 
            52%, 65% { border-left: 6px solid #f2a65a; border-top: 3px solid transparent; border-bottom: 3px solid transparent; } 
            70%, 90% { border-left: 8px solid #f2a65a; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
        }

        @keyframes babyBlushAnim {
            0%, 45% { opacity: 0; }
            52%, 65% { opacity: 1; }
            70%, 100% { opacity: 0; }
        }

        @keyframes babyWingLeft {
            0%, 5%, 95%, 100% { transform: rotate(0); }
            10%, 25% { transform: rotate(-130deg); } 
            32%, 45% { transform: rotate(-160deg); } 
            52%, 65% { transform: rotate(45deg); } 
            70%, 74% { transform: rotate(-40deg); } 
            76%, 90% { transform: rotate(-120deg); } 
        }

        @keyframes babyWingRight {
            0%, 5%, 95%, 100% { transform: rotate(0); }
            10%, 25% { transform: rotate(130deg); } 
            32%, 45% { transform: rotate(160deg); } 
            52%, 65% { transform: rotate(-45deg); } 
            70%, 74% { transform: rotate(40deg); } 
            76%, 90% { transform: rotate(120deg); } 
        }

        @keyframes babyMarkAnim {
            0%, 25% { opacity: 0; transform: translateY(0); }
            32%, 45% { opacity: 1; transform: translateY(-5px) scale(1.2); }
            50%, 100% { opacity: 0; transform: translateY(0); }
        }


        /* --- القلب السحري والكتكوت الأساسي --- */
        .heart-wrapper {
            position: absolute;
            top: 0; 
            left: 0;
            transform: translate(var(--x), var(--y));
            pointer-events: none;
            z-index: 6;
        }

        .magic-heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff4757;
            top: -10px;
            left: -10px;
            transform: rotate(-45deg);
            animation: pulse 1s infinite alternate;
        }
        .magic-heart::before, .magic-heart::after {
            content: ''; position: absolute; width: 20px; height: 20px; background: #ff4757; border-radius: 50%;
        }
        .magic-heart::before { top: -10px; left: 0; }
        .magic-heart::after { left: 10px; top: 0; }

        @keyframes pulse {
            0% { transform: rotate(-45deg) scale(1); filter: drop-shadow(0 0 10px #ff4757); }
            100% { transform: rotate(-45deg) scale(1.2); filter: drop-shadow(0 0 20px #ff4757); }
        }

        #chicken-system {
            position: absolute; top: 0; left: 0; width: 0; height: 0; z-index: 5; pointer-events: none;
        }

        #arm {
            position: absolute; top: -35px; left: 0; height: 3px; background: #ff4757; box-shadow: 0 0 8px #ff4757;
            transform-origin: left center; border-radius: 4px; z-index: 4;
        }

        #chicken-visuals {
            position: absolute; bottom: 0; left: -30px; width: 60px; height: 60px;
            transform-origin: bottom center; transition: transform 0.1s ease-out;
        }

        .chicken-body {
            position: absolute; bottom: 15px; width: 60px; height: 50px;
            background: #2a221f; border-radius: 50% 50% 40% 40%; transition: transform 0.1s;
        }

        .wing {
            position: absolute; top: 20px; left: 10px; width: 24px; height: 14px;
            background: #c75c50; border-radius: 12px 12px 4px 4px; transform-origin: top center; transition: transform 0.2s; z-index: 2;
        }

        .comb {
            position: absolute; top: -10px; right: 10px; width: 26px; height: 12px;
            background: #c75c50; border-radius: 12px 12px 0 0;
        }

        .beak {
            position: absolute; top: 20px; right: -10px; width: 0; height: 0;
            border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 12px solid #f2a65a;
        }

        .eye {
            position: absolute; top: 12px; width: 16px; height: 16px;
            background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .eye.left { right: 20px; } .eye.right { right: 2px; }

        .pupil { width: 7px; height: 7px; background: #111; border-radius: 50%; }

        .leg {
            position: absolute; bottom: 0; width: 4px; height: 16px;
            background: #2a221f; transform-origin: top center; transition: transform 0.2s;
        }
        .leg.left { right: 35px; } .leg.right { right: 15px; }
        
        .foot {
            position: absolute; bottom: 0; right: -4px; width: 10px; height: 4px;
            background: #2a221f; border-radius: 2px;
        }

        @keyframes walkLeft { 0%, 50%, 100% { transform: rotate(0deg); } 25% { transform: rotate(30deg); } 75% { transform: rotate(-30deg); } }
        @keyframes walkRight { 0%, 50%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-30deg); } 75% { transform: rotate(30deg); } }
        
        .walking:not(.flying):not(.jumping) .leg.left { animation: walkLeft 0.4s infinite linear; }
        .walking:not(.flying):not(.jumping) .leg.right { animation: walkRight 0.4s infinite linear; }

        @keyframes flap { 0% { transform: rotate(10deg); } 100% { transform: rotate(-60deg); } }
        .flying .wing { animation: flap 0.15s infinite alternate ease-in-out; }
        .flying .leg.left { transform: rotate(-25deg); } .flying .leg.right { transform: rotate(15deg); }

        .jumping .chicken-body { transform: scaleY(1.05) scaleX(0.95); }
        .jumping .wing { transform: rotate(-40deg); }
        .jumping .leg.left { transform: rotate(20deg); }
        .jumping .leg.right { transform: rotate(-20deg); }
    </style>
</head>
<body>

    <div class="base-layer">
        
        <div class="title-container">
            <div class="baby-chick">
                <div class="baby-sign">سهر شلابسه؟</div>
                <div class="baby-surprise-mark">!</div>
                <div class="baby-comb"></div>
                <div class="baby-body">
                    <div class="baby-wing left"></div>
                    <div class="baby-wing right"></div>
                    <div class="baby-eye left"><div class="baby-pupil"></div></div>
                    <div class="baby-eye right"><div class="baby-pupil"></div></div>
                    <div class="baby-blush left"></div>
                    <div class="baby-blush right"></div>
                    <div class="baby-beak"></div>
                </div>
            </div>
            
            <h1>احبك سهورتي</h1>
        </div>

        <p>شرايك بشغلي؟</p>
        <a href="#" class="btn">احلى مسوقه بالدنيا</a>
        
        <div class="big-404">404</div>
    </div>
    
    <div class="floor"></div>

    <div class="hidden-layer">
        <div class="big-404">LOVE</div>
    </div>

    <div class="heart-wrapper">
        <div class="magic-heart"></div>
    </div>

    <div id="chicken-system">
        <div id="arm"></div>
        <div id="chicken-visuals">
            <div class="comb"></div>
            <div class="chicken-body">
                <div class="wing"></div>
                <div class="eye left"><div class="pupil" id="pupil1"></div></div>
                <div class="eye right"><div class="pupil" id="pupil2"></div></div>
                <div class="beak"></div>
            </div>
            <div class="leg left"><div class="foot"></div></div>
            <div class="leg right"><div class="foot"></div></div>
        </div>
    </div>

    <script>
        const root = document.documentElement;
        const chickenSystem = document.getElementById('chicken-system');
        const chickenVisuals = document.getElementById('chicken-visuals');
        const arm = document.getElementById('arm');
        const pupil1 = document.getElementById('pupil1');
        const pupil2 = document.getElementById('pupil2');
        
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        
        let chickenX = mouseX;
        let chickenY = window.innerHeight - 80;
        let isFacingRight = true;

        let jumpY = 0;
        let velocityY = 0;
        const gravity = 1.2;

        function updateMouse(e) {
            mouseX = e.touches ? e.touches[0].clientX : e.clientX;
            mouseY = e.touches ? e.touches[0].clientY : e.clientY;
            root.style.setProperty('--x', mouseX + 'px');
            root.style.setProperty('--y', mouseY + 'px');
        }

        window.addEventListener('mousemove', updateMouse);
        window.addEventListener('touchmove', updateMouse, { passive: false }); // منع السكرول بالسحب

        function triggerJump() {
            if (jumpY === 0 && !chickenVisuals.classList.contains('flying')) {
                velocityY = -18; 
                chickenVisuals.classList.add('jumping');
            }
        }

        window.addEventListener('mousedown', triggerJump);
        window.addEventListener('touchstart', triggerJump, { passive: true });

        function animate() {
            let floorY = window.innerHeight - 80;

            let dxChicken = mouseX - chickenX;
            chickenX += dxChicken * 0.05;

            if (Math.abs(dxChicken) > 3) {
                chickenVisuals.classList.add('walking');
            } else {
                chickenVisuals.classList.remove('walking');
            }

            if (dxChicken > 15 && !isFacingRight) {
                chickenVisuals.style.transform = 'scaleX(1)';
                isFacingRight = true;
            } else if (dxChicken < -15 && isFacingRight) {
                chickenVisuals.style.transform = 'scaleX(-1)';
                isFacingRight = false;
            }

            let targetY = Math.min(floorY, mouseY + 140);
            chickenY += (targetY - chickenY) * 0.08;

            if (chickenY < floorY - 10) {
                chickenVisuals.classList.add('flying');
            } else {
                chickenVisuals.classList.remove('flying');
            }

            if (velocityY !== 0 || jumpY < 0) {
                velocityY += gravity;
                jumpY += velocityY;
                
                if (jumpY > 0) {
                    jumpY = 0;
                    velocityY = 0;
                    chickenVisuals.classList.remove('jumping');
                }
            }

            let renderY = chickenY + jumpY;
            chickenSystem.style.transform = `translate(${chickenX}px, ${renderY}px)`;

            let shoulderY = renderY - 35; 
            let dyArm = mouseY - shoulderY;
            let dxArm = mouseX - chickenX;
            
            let angle = Math.atan2(dyArm, dxArm) * (180 / Math.PI);
            let distance = Math.sqrt(dxArm * dxArm + dyArm * dyArm);

            arm.style.width = distance + 'px';
            arm.style.transform = `rotate(${angle}deg)`;

            function updatePupil(pupilElem) {
                let rect = pupilElem.parentElement.getBoundingClientRect();
                let eyeCenterX = rect.left + rect.width / 2;
                let eyeCenterY = rect.top + rect.height / 2;
                
                let dxEye = mouseX - eyeCenterX;
                let dyEye = mouseY - eyeCenterY;
                let angleEye = Math.atan2(dyEye, dxEye);
                
                let maxDist = 3;
                let distEye = Math.min(maxDist, Math.sqrt(dxEye*dxEye + dyEye*dyEye) * 0.1);
                
                let moveX = Math.cos(angleEye) * distEye;
                let moveY = Math.sin(angleEye) * distEye;
                
                if (!isFacingRight) moveX = -moveX;
                pupilElem.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }

            updatePupil(pupil1);
            updatePupil(pupil2);

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            if (jumpY === 0) chickenY = window.innerHeight - 80;
        });

        animate();
    </script>
</body>
</html>
